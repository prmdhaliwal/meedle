<html>
    <head>
        <title>Assignment Page</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <header>
            <h1>Assignments</h1>
        </header>
        <main>
            <section id="assignments">
                <h2>Create New Assignments</h2>
                <button type="button" id="addAssignmentBtn">Add New Assignment</button>
                
                <div class="assignment-list" id="assignmentList">
                    <!-- Assignments will be added here dynamically -->
                </div>
            </section>
            
            <!-- I used Deepseek to create a HTML form template, of which I then edited myself to meet the assignment requirements. -->
            <!-- Assignment Form Modal -->
            <div class="modal" id="assignmentModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Add New Assignment</h2>
                        <span class="close" id="closeModal">&times;</span>
                    </div>
                    <form id="assignmentForm">
                        <div class="form-group">
                            <label for="title">Assignment Title</label>
                            <input type="text" id="title" required placeholder="Enter assignment title">
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" required placeholder="Enter assignment description"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="weighting">Weighting</label>
                            <textarea id="weighting" required placeholder="Enter assignment weighting"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="lessonId">Lesson ID</label>
                            <input type="text" id="lessonId" required placeholder="Enter Lesson ID">
                        </div>
                        <button type="submit" class="submit-btn">Add Assignment</button>
                    </form>
                </div>
            </div>
        </main>
</html>
