<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Register Page</title>
    <link href="/bootstrap.min.css" rel="stylesheet" />
  </head>

  <body class="bg-light">
    <main>

      <div class="album p-3 mb-5 bg-primary">
        <h1 class="text-center text-white">Register Page</h1>
      </div>
      
      <div>
        <div class="container mb-5 d-flex justify-content-center">
          <div class="col-4">
            <div class="card shadow">
                <div class="card-body">

              <!-- FORM -->
              <form action="/auth/register" method="POST">
                <div>
                  <label for="name" class="form-label">Name:</label>
                  <input type="text" id="name" name="name" class="form-control" required />
                </div>

                <div>
                  <label for="email" class="form-label">Email:</label>
                  <input type="email" id="email" name="email" class="form-control" required />
                </div>

                <div>
                  <label for="password" class="form-label">Password:</label>
                  <input type="password" id="password" name="password" class="form-control" required />
                </div>

                <button type="submit" class="btn btn-primary m-2 py-1">Register</button>
              </form>
              <a href="/auth/login" class="btn btn-link">Already have an account? Login here</a>

            </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>

<%- include('partials/footer') %>
