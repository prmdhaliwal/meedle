<%- include('partials/header') %>
<div class="album p-2 mb-4">
  <h1 class="text-center text-black">Assignments</h1>
</div>

<div class="container" style="max-width: 800px;">
  <% if (typeof error !== 'undefined' && error) { %>
    <div class="alert alert-danger"><%= error %></div>
  <% } %>

  <% if (typeof created !== 'undefined' && created) { %>
    <div class="alert alert-success">Assignment created</div>
  <% } %>
  
  <form method="POST" action="/instructor/assignments-edit">
        <!-- assignment form -->
        <div class="mb-3">
            <label class="form-label">Assignment Title</label>
            <input type="text" name="title" class="form-control" required placeholder="Enter assignment title">
        </div>
        <div class="mb-3">
            <label class="form-label">Body</label>
            <textarea type="text" name="body" class="form-control" rows="8" required placeholder="Enter assignment body"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Weighting</label>
            <textarea class="form-control" name="weighting" required placeholder="Enter assignment weighting"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Lesson</label>
            <select class="selectpicker" data-width="100%" data-style="form-control" data-live-search="true" name="LessonId" required>
              <option value="" disabled selected>Select a Lesson</option>
              <% (lessons || []).forEach(function(c){ %>
                <option value="<%= c._id %>"><%= c.course %> — <%= c.title %></option>
              <% }) %>
            </select>
        </div>
        <a href="/instructor/assignments" class="btn btn-secondary ms-2">Go Back</a>
        <button type="submit" class="btn btn-primary">Add Assignment</button>
        
    </form>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script>

<script>
  $(function () {
    $('.selectpicker').selectpicker();
  });
</script>
<%- include('partials/footer') %>
