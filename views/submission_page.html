<!doctype html>
<html>
<head>
  <title>Student Assignment Submission</title>
  <style>
    body { padding: 20px; font-family: Arial, sans-serif; background-color: #f9f9f9; }
    .form-box { border: 1px solid #ddd; padding: 20px; border-radius: 8px; width: 600px; background: #fff; box-shadow: 0px 2px 5px rgba(0,0,0,0.1); }
    label { font-weight: bold; display: block; margin-bottom: 8px; }
    textarea { width: 95%; height: 150px; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; resize: vertical; display: block; margin: 0 auto; }
    button { margin-top: 12px; background-color: #007bff; color: white; padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .alert { margin-top: 12px; padding: 10px; border-radius: 6px; }
    .alert-success { background: #d1fae5; color: #065f46; }
    .alert-error { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <h1 style="color:#007bff;">Assignment Submission</h1>
  <div class="form-box">
    <!-- This form posts to /submission -->
    <form id="submissionPage" method="POST" action="/submission">
      <input type="hidden" id="assignmentId" name="assignmentId" value="<%= assignmentId || '' %>"/>
      <label for="answer">Type your answer:</label>
      <textarea id="answer" name="answer" placeholder="Enter your answer here..."></textarea>
      <button type="submit">Submit</button>
    </form>

    <% if (typeof created !== 'undefined' && created) { %>
      <div class="alert alert-success">✅ Assignment submitted successfully.</div>
    <% } %>

    <% if (typeof error !== 'undefined' && error) { %>
      <div class="alert alert-error"><%= error %></div>
    <% } %>
  </div>
</body>
</html>
