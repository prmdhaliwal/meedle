<!doctype html>
<html>
<head>
  <title>Student Assignment Submission</title>
  <style>
    body { padding: 20px; font-family: Arial, sans-serif; background-color: #f9f9f9; }
    .form-box { border: 1px solid #ddd; padding: 20px; border-radius: 8px; width: 600px; background: #fff; box-shadow: 0px 2px 5px rgba(0,0,0,0.1); }
    label { font-weight: bold; display: block; margin-bottom: 8px; }
    textarea { width: 95%; height: 150px; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; resize: vertical; display: block; margin: 0 auto; }
    button { margin-top: 12px; background-color: #007bff; color: white; padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    #successMsg { color: green; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <h1 style="color:#007bff;">Assignment Submission</h1>
  <div class="form-box">
    <form id="submissionPage" method="POST">
      <input type="hidden" id="assignmentId" name="assignmentId" />
      <label for="answer">Type your answer:</label>
      <textarea id="answer" name="answer" placeholder="Enter your answer here..."></textarea>
      <button type="submit">Submit</button>
    </form>
    <div id="successMsg">Assignment submitted successfully</div>
  </div>

  <script>
    const parts = window.location.pathname.split('/');
    const assignmentId = parts[2] || "";
    document.getElementById("assignmentId").value = assignmentId;

    const form = document.getElementById("submissionPage");
    const input = document.getElementById("answer");
    const successMsg = document.getElementById("successMsg");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      successMsg.style.display = "none";
      if (input.value.trim() === "") {
        alert("No answer provided. Please type your answer.");
      } else {
        successMsg.style.display = "block";
        console.log("Submitting for assignmentId:", assignmentId);
      }
    });
  </script>
</body>
</html>
