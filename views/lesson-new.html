<%- include('partials/header') %>

<div class="album p-3 mb-5">
  <h1 class="text-center text-dark">Create Lesson</h1>
</div>

<div class="container" style="max-width: 800px;">
  <% if (typeof error !== 'undefined' && error) { %>
    <div class="alert alert-danger"><%= error %></div>
  <% } %>

  <% if (typeof created !== 'undefined' && created) { %>
    <div class="alert alert-success">Lesson created!</div>
  <% } %>

  <form method="POST" action="/instructor/lessons">
    <!-- Course dropdown -->
    <div class="mb-3">
      <label class="form-label">Course</label>
      <select class="form-select" name="courseId" required>
        <option value="" disabled selected>Select a course</option>
        <% (courses || []).forEach(function(c){ %>
          <option value="<%= c._id %>"><%= c.code %> — <%= c.title %></option>
        <% }) %>
      </select>
    </div>

    <!-- Lesson title -->
    <div class="mb-3">
      <label class="form-label">Lesson title</label>
      <input type="text" class="form-control" name="title" required />
    </div>

    <!-- Lesson content -->
    <div class="mb-3">
      <label class="form-label">Content</label>
      <textarea class="form-control" name="content" rows="8" placeholder="Write lesson content here..." required></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Create Lesson</button>
  </form>
</div>

<%- include('partials/footer') %>
